# Blueprint de Render (sin Docker: Render ejecuta Node directo).
# Crear el servicio desde el dashboard de Render: New -> Blueprint -> este repo.
#
# Un solo servicio web: la API de tabulacion (node_app) monta dentro el
# servicio Tutorica Forms (forms/) en el mismo proceso. El build instala las
# dependencias de ambos paquetes.
#
# MODO PRUEBAS (plan gratuito, configuracion actual):
# - Sin disco persistente: los usuarios que crees funcionan normal, pero se
#   borran cuando el servicio se reinicia, despierta de la suspension o haces
#   deploy. El admin inicial se recrea solo (ADMIN_EMAIL/ADMIN_PASSWORD).
#
# MODO PRODUCCION (plan Starter o superior): descomenta el bloque `disk` y la
# variable USER_STORE_PATH para que los usuarios persistan en /var/data.
services:
  - type: web
    name: tabulacion-api
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev --prefix node_app && npm ci --omit=dev --prefix forms
    startCommand: node node_app/server.js
    # La generacion del Excel corre en un worker aparte (node_app/lib/generation/),
    # asi que ya NO bloquea el event loop: el healthcheck HTTP vuelve a ser
    # seguro (antes mataba el proceso a mitad de una generacion).
    healthCheckPath: /health
    autoDeploy: true
    # disk:
    #   name: tabulacion-data
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Contenedor de 512 MB: limitar el heap fuerza GC agresivo y evita
      # que el pico de memoria de la generacion mate el proceso. El worker de
      # generacion hereda este mismo presupuesto (a proposito: fijarle un
      # techo propio resulto contraproducente, ver lib/generation/run.js).
      - key: NODE_OPTIONS
        value: "--max-old-space-size=400"
      # Generaciones de Excel simultaneas. Cada una corre en su propio worker
      # con su propio heap, asi que subirlo multiplica la memoria: con 512 MB
      # de contenedor, dejar 1. Las peticiones extra esperan en cola (hasta
      # GENERATION_MAX_QUEUED) en vez de bloquear el servidor.
      - key: GENERATION_MAX_CONCURRENT
        value: "1"
      - key: AUTH_REQUIRED
        value: "true"
      # Secretos: definirlos en el dashboard de Render (sync: false hace que
      # Render los pida al crear el servicio; nunca van al repositorio).
      - key: AUTH_TOKEN_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Clave de API fija del admin para la extension Tutorica Forms (formato
      # ttab_ + 43 caracteres aleatorios). Sin disco persistente users.json se
      # borra en cada reinicio; esta variable restaura la clave al arrancar.
      - key: ADMIN_API_KEY
        sync: false
      # Dominio del frontend en Vercel (+ localhost para desarrollo).
      - key: CORS_ORIGIN
        value: http://localhost:5173,https://tabulacion.vercel.app
      # Forms valida las claves en proceso; permite a la extension desde
      # cualquier origen (la clave es el control de acceso real).
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      # Almacen de usuarios en Postgres (Neon). Es lo que hace que las cuentas,
      # sus usos y sus claves ttab_ sobrevivan a los deploys: el disco del plan
      # gratis es efimero y se borraba en cada uno. Se define en el dashboard.
      # Sin esta variable el servidor cae al archivo JSON efimero.
      - key: DATABASE_URL
        sync: false
      # - key: USER_STORE_PATH
      #   value: /var/data/users.json
      - key: AUTH_TOKEN_TTL_SECONDS
        value: "86400"
      - key: RESULT_TTL_SECONDS
        value: "900"
      - key: MAX_BODY_BYTES
        value: "4194304"
      # Tabulacion Descriptiva (IA): clave de OpenRouter (se define en el
      # dashboard). El modelo y el timeout tienen defaults en el codigo
      # (z-ai/glm-5.2, 300 s); se declaran aqui para poder cambiarlos sin
      # tocar el codigo.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: z-ai/glm-5.2
      # 10 min: la generacion real con N=60 tarda ~4 min; con N altos escala
      # casi linealmente con las filas.
      - key: OPENROUTER_TIMEOUT_MS
        value: "600000"
