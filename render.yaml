# Infraestructura de produccion. API y worker se construyen desde el mismo
# commit; CI debe pasar antes del auto-deploy. Neon es la unica base de datos
# y R2 el unico almacen de artefactos en produccion.
services:
  - type: web
    name: tabulacion-api
    runtime: node
    branch: main
    region: oregon
    plan: starter
    numInstances: 1
    buildCommand: npm ci --omit=dev --prefix node_app && npm ci --omit=dev --prefix forms
    preDeployCommand: npm run deploy:preflight:api --prefix node_app && npm run db:migrate --prefix node_app
    startCommand: node node_app/server.js
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NPM_CONFIG_ENGINE_STRICT
        value: "true"
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: "--max-old-space-size=400"
      - key: STORE_AUTO_MIGRATE
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: AUTH_REQUIRED
        value: "true"
      - key: AUTH_TOKEN_SECRET
        sync: false
      - key: AUTH_TOKEN_TTL_SECONDS
        value: "86400"
      - key: REGISTRATION_ENABLED
        value: "false"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://tabulacion-api.onrender.com
      - key: CORS_ORIGIN
        value: https://tabulacion.vercel.app,http://localhost:5173,chrome-extension://kdppbednjfajcjogdajmagfabidfjmem
      - key: CORS_ALLOWED_ORIGINS
        value: https://tabulacion.vercel.app,http://localhost:5173,chrome-extension://kdppbednjfajcjogdajmagfabidfjmem
      - key: CHROME_EXTENSION_ID
        value: kdppbednjfajcjogdajmagfabidfjmem
      - key: GENERATION_MAX_CONCURRENT
        value: "1"
      - key: GENERATION_MAX_QUEUED
        value: "20"
      - key: TESISTAB_RUN_JOBS_INLINE
        value: "false"
      - key: MAX_BODY_BYTES
        value: "4194304"
      - key: RESULT_TTL_SECONDS
        value: "900"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: ARTIFACT_RETENTION_DAYS
        value: "30"
      - key: ARTIFACT_SIGNED_URL_SECONDS
        value: "300"
      - key: TAYPI_PUBLIC_KEY
        sync: false
      - key: TAYPI_SECRET_KEY
        sync: false
      - key: TAYPI_WEBHOOK_SECRET
        sync: false
      - key: TAYPI_SANDBOX
        value: "true"
      - key: TAYPI_TIMEOUT_MS
        value: "10000"
      - key: FORMS_RESPONSE_PRICE_CENTS
        sync: false
      # Interruptor de seguridad. Solo se cambia a true despues de completar
      # el runbook y las attestations externas de Neon, R2, Render y dominio.
      - key: COMMERCIAL_LAUNCH_ENABLED
        value: "false"
      - key: NEON_BACKUP_CONFIRMED
        sync: false
      - key: NEON_BACKUP_REFERENCE
        sync: false
      - key: NEON_STAGING_BRANCH_CONFIRMED
        sync: false
      - key: R2_BUCKET_SCOPE_CONFIRMED
        sync: false
      - key: R2_LIFECYCLE_CONFIRMED
        sync: false
      - key: RENDER_REQUIRED_CHECKS_CONFIRMED
        sync: false
      - key: RENDER_STARTER_SERVICES_CONFIRMED
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: z-ai/glm-5.2
      - key: OPENROUTER_TIMEOUT_MS
        value: "600000"

  - type: worker
    name: tabulacion-forms-worker
    runtime: node
    branch: main
    region: oregon
    plan: starter
    numInstances: 1
    buildCommand: npm ci --omit=dev --prefix node_app && npm ci --omit=dev --prefix forms
    # La migracion se ejecuta una sola vez en el pre-deploy del API. El worker
    # espera en modo read-only a que esa version de schema quede confirmada.
    startCommand: npm run deploy:preflight:worker --prefix node_app && npm run db:wait-schema --prefix node_app && node forms/worker.js
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NPM_CONFIG_ENGINE_STRICT
        value: "true"
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: "--max-old-space-size=400"
      - key: DATABASE_URL
        sync: false
      - key: STORE_AUTO_MIGRATE
        value: "false"
      - key: TESISTAB_WORKER_MODE
        value: "true"
      - key: TESISTAB_RUN_JOBS_INLINE
        value: "false"
      - key: TESISTAB_JOB_BATCH_SIZE
        value: "100"
      - key: TESISTAB_JOB_LEASE_MS
        value: "30000"
      - key: FORMS_WORKER_ADAPTER
        value: node_app/forms-worker-adapter.js
      - key: SCHEMA_WAIT_TIMEOUT_SECONDS
        value: "600"
      - key: CHROME_EXTENSION_ID
        value: kdppbednjfajcjogdajmagfabidfjmem
      # Aunque el worker no publica HTTP, Forms valida esta configuracion al
      # cargar para impedir que un despliegue vuelva a habilitar comodines.
      - key: CORS_ALLOWED_ORIGINS
        value: https://tabulacion.vercel.app,http://localhost:5173,chrome-extension://kdppbednjfajcjogdajmagfabidfjmem
